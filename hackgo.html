<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Hackgo</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hackgo">
<meta name="theme-color" content="#07070b">
<style>
:root{
  --bg:#07070b; --bg2:#10101c;
  --win:#0b0d16; --bar:#161a2b; --edge:#2a2e46;
  --limb:#6f78c4; --limbd:#5a63b4;
  --mint:#aef0e2; --violet:#a878ff; --txt:#cdd5e6; --dim:#747ca0; --ink:#eef0ff;
  color-scheme:dark;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:
    radial-gradient(48vmax 48vmax at 50% 42%, rgba(120,110,210,.12), transparent 60%),
    linear-gradient(160deg,var(--bg),var(--bg2));
  color:var(--ink); font-family:ui-rounded,system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:16px;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}

.creature{position:relative;z-index:1;width:min(90vw,470px);cursor:pointer;
  animation:bob 3.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@media (prefers-reduced-motion:reduce){.creature{animation:none}}

.head{width:172px;margin:0 auto -30px;position:relative;z-index:3;display:block}
.head svg{width:100%;height:auto;display:block;overflow:visible}

.arm{position:absolute;top:52%;width:20px;height:46px;border-radius:12px;background:var(--limb);z-index:1}
.arm.l{left:-12px;transform:rotate(8deg)}
.arm.r{right:-12px;transform:rotate(-8deg);transform-origin:top center}
.creature.wave .arm.r{animation:wave .5s ease-in-out 4}
@keyframes wave{0%,100%{rotate:0deg}50%{rotate:-40deg}}

.win{position:relative;z-index:2;background:var(--win);border:1.5px solid var(--edge);
  border-radius:18px;overflow:hidden;box-shadow:0 26px 70px rgba(0,0,0,.55),0 0 50px rgba(120,110,210,.08)}
.bar{display:flex;align-items:center;gap:7px;padding:10px 14px 9px;background:var(--bar);border-bottom:1px solid var(--edge)}
.dot{width:11px;height:11px;border-radius:50%}
.dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
.bar .title{flex:1;text-align:center;font:600 12px/1 ui-monospace,Menlo,monospace;color:var(--dim);letter-spacing:.05em}
.bar .title b{color:var(--violet)}
.term{padding:16px 16px 18px;min-height:150px;
  font:500 clamp(12.5px,3.4vw,14.5px)/1.75 ui-monospace,SFMono-Regular,Menlo,monospace}
.ln{white-space:pre-wrap;word-break:break-word}
.p{color:var(--mint)}.ok{color:var(--mint)}.ar{color:var(--violet)}.d{color:var(--dim)}.t{color:var(--txt)}
.cur{display:inline-block;width:8px;height:1.05em;vertical-align:-2px;background:var(--mint);margin-left:3px;animation:blink 1.05s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

.feet{display:flex;justify-content:center;gap:16px;margin-top:-2px}
.foot{width:26px;height:16px;background:var(--limbd);border-radius:0 0 13px 13px}

#eyecur{animation:blink 1.1s steps(1,end) infinite}
@media (prefers-reduced-motion:reduce){#eyecur,.cur{animation:none}}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="creature" id="creature" role="button" aria-label="Hackgo" tabindex="0">
  <span class="arm l"></span><span class="arm r"></span>
  <div class="head">
    <svg viewBox="0 0 300 196" aria-hidden="true">
      <defs>
        <linearGradient id="cloudGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d85d8"/><stop offset="1" stop-color="#5f68bd"/></linearGradient>
        <filter id="termGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <g fill="url(#cloudGrad)">
        <circle cx="150" cy="120" r="58"/><circle cx="104" cy="112" r="34"/><circle cx="196" cy="112" r="34"/>
        <circle cx="124" cy="82" r="30"/><circle cx="176" cy="82" r="30"/><circle cx="150" cy="72" r="33"/>
      </g>
      <rect x="104" y="98" width="92" height="58" rx="20" fill="#15172a"/>
      <rect x="104" y="98" width="92" height="58" rx="20" fill="none" stroke="#3b3a63" stroke-width="2" opacity=".55"/>
      <g filter="url(#termGlow)">
        <path d="M131 115 L145 128 L131 141" fill="none" stroke="#aef0e2" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
        <rect id="eyecur" x="153" y="136" width="20" height="7.5" rx="3.7" fill="#aef0e2"/>
      </g>
    </svg>
  </div>
  <div class="win">
    <div class="bar">
      <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
      <span class="title"><b>hackgo</b> — h:CORE</span>
    </div>
    <div class="term" id="term"></div>
  </div>
  <div class="feet"><span class="foot"></span><span class="foot"></span></div>
</div>
<script>
(function(){
  var term=document.getElementById('term'),creature=document.getElementById('creature');
  var lines=[
    {h:'<span class="p">hackgo@h:core ~ %</span> <span class="t">iniciar</span>'},
    {h:'<span class="ar">▸</span> <span class="d">despertando a Hackgo…</span>'},
    {h:'<span class="ok">✓</span> <span class="t">Hackgo en línea</span>'},
    {h:'<span class="ok">✓</span> <span class="t">sistema: </span><span class="ok">vivo</span>'},
    {h:'<span class="ok">✓</span> <span class="t">nube: </span><span class="ok">conectada</span>'},
    {h:'<span class="ar">▸</span> <span class="t">esperando órdenes</span>'}
  ];
  var reduce=matchMedia('(prefers-reduced-motion:reduce)').matches, cur;
  function run(){
    term.innerHTML=''; var i=0;
    (function next(){
      if(i>=lines.length){ cur=document.createElement('span'); cur.className='cur'; term.appendChild(cur); setTimeout(run,9000); return; }
      var d=document.createElement('div'); d.className='ln'; d.innerHTML=lines[i].h; term.appendChild(d); i++;
      setTimeout(next, reduce?50:430+Math.random()*220);
    })();
  }
  run();
  function tap(){ creature.classList.remove('wave'); void creature.offsetWidth; creature.classList.add('wave');
    clearTimeout(tap._t); tap._t=setTimeout(function(){creature.classList.remove('wave');},2100); }
  creature.addEventListener('click',tap);
  creature.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();tap();}});

  var c=document.getElementById('sky'),x=c.getContext('2d'),W,H,dots=[];
  function size(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;}
  size(); addEventListener('resize',size);
  for(var i=0;i<36;i++){dots.push({x:Math.random(),y:Math.random(),r:(Math.random()*1.4+.4)*devicePixelRatio,s:Math.random()*.0003+.0001,a:Math.random()*.3+.1});}
  function draw(){ x.clearRect(0,0,W,H);
    for(var i=0;i<dots.length;i++){var d=dots[i]; if(!reduce){d.y-=d.s; if(d.y<-.02)d.y=1.02;}
      x.beginPath();x.arc(d.x*W,d.y*H,d.r,0,6.3);x.fillStyle='rgba(150,140,220,'+d.a+')';x.fill();}
    if(!reduce) requestAnimationFrame(draw); }
  draw();
})();
</script>
</body>
</html>
